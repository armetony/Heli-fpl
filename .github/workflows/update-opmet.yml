name: Update Italy OPMET
on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build METAR TAF snapshot
        run: python scripts/update_opmet.py
      - name: Commit snapshot
        run: |
          git config user.name "heli-fpl-weather-bot"
          git config user.email "actions@users.noreply.github.com"
          git add weather/italy_opmet.json
          git diff --cached --quiet || git commit -m "Update Italy METAR TAF"
          git push
